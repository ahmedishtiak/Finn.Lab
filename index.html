<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF8F3" />
<title>Finn.Lab — Finnish Language Learning Model</title>
<meta name="description" content="Finn.Lab: a trilingual (FI · EN · BN) Finnish learning system from Level 0 to YKI / C2." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   FINN.LAB — Design System
   Aesthetic: Editorial Nordic. Warm paper, ink type, confident
   Nordic blue, terracotta accents. Subtle gamification.
   ============================================================ */

:root {
  /* Surfaces */
  --bg:           #FAF8F3;
  --surface:      #FFFFFF;
  --surface-2:    #F2EFE7;
  --surface-3:    #ECE8DE;

  /* Ink (text) */
  --ink:          #1B2030;
  --ink-2:        #4A4F60;
  --ink-3:        #6E7280;
  --muted:        #9A9DA7;

  /* Borders */
  --border:       #E5E0D5;
  --border-2:     #D6D0C2;
  --border-strong:#1B2030;

  /* Brand */
  --accent:       #2D5BD7;
  --accent-soft:  #E6EBFA;
  --accent-deep:  #1E3FA0;

  /* Warm accent */
  --ember:        #C8542A;
  --ember-soft:   #F8E8DE;
  --ember-deep:   #8E3818;

  /* Status */
  --success:      #1F7A4D;
  --success-soft: #E0EFE7;
  --warning:      #B86A1A;
  --warning-soft: #FAEEDA;
  --danger:       #B23A3A;
  --danger-soft:  #F6E3E1;

  /* Level chips (subtle, monochromatic blue family + neutrals) */
  --l0-bg:  #ECE8DE;  --l0-ink:  #4A4F60;
  --a1-bg:  #E6EBFA;  --a1-ink:  #1E3FA0;
  --a2-bg:  #DDE4F6;  --a2-ink:  #1E3FA0;
  --b1-bg:  #E5E7C9;  --b1-ink:  #5B6512;
  --b2-bg:  #F2E5C0;  --b2-ink:  #6E5510;
  --c1-bg:  --ember-soft; --c1-ink: --ember-deep;
  --c2-bg:  #F0DCD0;  --c2-ink:  --ember-deep;

  /* Typography */
  --font-serif: "Fraunces", "Iowan Old Style", "Apple Garamond", Georgia, serif;
  --font-sans:  "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:  "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --font-bn:    "Noto Sans Bengali", "IBM Plex Sans", sans-serif;

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(27,32,48,0.04), 0 1px 1px rgba(27,32,48,0.03);
  --shadow-md: 0 2px 6px rgba(27,32,48,0.06), 0 4px 12px rgba(27,32,48,0.04);
  --shadow-lg: 0 8px 24px rgba(27,32,48,0.08), 0 16px 48px rgba(27,32,48,0.06);

  /* Layout */
  --nav-w: 240px;
  --header-h: 64px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

html {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background:
    radial-gradient(ellipse at top left, rgba(45,91,215,0.04), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(200,84,42,0.03), transparent 50%),
    var(--bg);
  min-height: 100vh;
}

::selection { background: var(--accent); color: white; }

/* Headings */
h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0;
}
h1 { font-size: 2.25rem; font-variation-settings: "opsz" 100, "SOFT" 30; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
h4 { font-size: 1rem; font-weight: 600; font-family: var(--font-sans); letter-spacing: 0; }

p { margin: 0 0 0.75em; color: var(--ink-2); }
p:last-child { margin-bottom: 0; }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-deep); text-decoration: underline; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

input, textarea, select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: vertical; min-height: 80px; font-family: var(--font-sans); }
label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ====== Layout ====== */
.app {
  display: grid;
  grid-template-columns: var(--nav-w) 1fr;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-areas:
    "header header"
    "nav    main";
  min-height: 100vh;
}

.app-header {
  grid-area: header;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 0;
  font-family: var(--font-serif);
  font-size: 1.5rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  font-variation-settings: "opsz" 100, "SOFT" 50;
}
.brand .dot {
  color: var(--accent);
  font-weight: 800;
  margin: 0 1px;
}
.brand .tag {
  font-family: var(--font-sans);
  font-size: 0.65rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-left: 10px;
  padding: 3px 7px;
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  align-self: center;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.streak-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--ember-soft);
  color: var(--ember-deep);
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.85rem;
  font-feature-settings: "tnum";
}

/* Level selector */
.level-bar {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border-radius: 999px;
}
.level-chip {
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  transition: all 0.15s;
  font-family: var(--font-mono);
}
.level-chip:hover { color: var(--ink); }
.level-chip.active {
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow-sm);
}

/* Navigation sidebar */
.app-nav {
  grid-area: nav;
  padding: 24px 16px;
  border-right: 1px solid var(--border);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-title {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 12px;
  margin-top: 16px;
}
.nav-section-title:first-child { margin-top: 0; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  font-size: 0.92rem;
  font-weight: 500;
  color: var(--ink-2);
  transition: all 0.12s;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active {
  background: var(--ink);
  color: var(--bg);
}
.nav-item.active .nav-icon { opacity: 1; }
.nav-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  opacity: 0.7;
}
.nav-badge {
  margin-left: auto;
  background: var(--ember);
  color: white;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 999px;
  min-width: 18px;
  text-align: center;
}
.nav-item.active .nav-badge { background: var(--bg); color: var(--ink); }

/* Main content */
.app-main {
  grid-area: main;
  padding: 32px 40px 80px;
  overflow-y: auto;
  max-width: 100%;
}
.page {
  max-width: 1100px;
  margin: 0 auto;
  animation: fadeUp 0.35s cubic-bezier(0.2, 0.7, 0.3, 1);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.page-header {
  margin-bottom: 28px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.page-header h1 { margin-bottom: 4px; }
.page-header .lead { color: var(--ink-3); font-size: 0.95rem; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--r-md);
  font-weight: 500;
  font-size: 0.9rem;
  transition: all 0.15s;
  white-space: nowrap;
  border: 1px solid transparent;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover { background: #2A3145; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-secondary {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
.btn-accent {
  background: var(--accent);
  color: white;
}
.btn-accent:hover { background: var(--accent-deep); }
.btn-ghost {
  color: var(--ink-2);
}
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border-color: transparent;
}
.btn-danger:hover { background: var(--danger); color: white; }
.btn-sm { padding: 5px 10px; font-size: 0.82rem; }
.btn-lg { padding: 14px 24px; font-size: 1rem; }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
}
.card-flat {
  background: var(--surface-2);
  border: none;
  border-radius: var(--r-lg);
  padding: 20px;
}

/* Grid layouts */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* Stat cards */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.stat-card .label {
  font-size: 0.78rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-bottom: 10px;
}
.stat-card .value {
  font-family: var(--font-serif);
  font-size: 2.4rem;
  font-weight: 500;
  line-height: 1;
  color: var(--ink);
  font-variation-settings: "opsz" 100;
  font-feature-settings: "tnum";
}
.stat-card .sub {
  margin-top: 8px;
  font-size: 0.82rem;
  color: var(--ink-3);
}
.stat-card.accent-blue { background: var(--accent-soft); border-color: transparent; }
.stat-card.accent-blue .value { color: var(--accent-deep); }
.stat-card.accent-ember { background: var(--ember-soft); border-color: transparent; }
.stat-card.accent-ember .value { color: var(--ember-deep); }

/* Progress ring */
.ring {
  --size: 64px;
  --stroke: 6px;
  --pct: 0;
  width: var(--size);
  height: var(--size);
  position: relative;
  display: inline-grid;
  place-items: center;
}
.ring svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.ring .ring-text {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink);
}

/* Progress bar */
.bar {
  height: 8px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}
.bar > .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.4s ease;
}

/* Tables */
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.92rem;
}
.table th {
  text-align: left;
  font-weight: 600;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.table td {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.table tr:hover td { background: var(--surface-2); }
.table .fi { font-family: var(--font-serif); font-weight: 500; color: var(--ink); font-size: 1.05em; }
.table .en { color: var(--ink-2); }
.table .bn { font-family: var(--font-bn); color: var(--ink-2); }

/* Tags / chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--font-mono);
}
.chip.level-0  { background: var(--l0-bg); color: var(--l0-ink); }
.chip.level-A1 { background: var(--a1-bg); color: var(--a1-ink); }
.chip.level-A2 { background: var(--a2-bg); color: var(--a2-ink); }
.chip.level-B1 { background: var(--b1-bg); color: var(--b1-ink); }
.chip.level-B2 { background: var(--b2-bg); color: var(--b2-ink); }
.chip.level-C1 { background: var(--ember-soft); color: var(--ember-deep); }
.chip.level-C2 { background: #F0DCD0; color: var(--ember-deep); }

.chip.status-new      { background: var(--surface-2); color: var(--ink-3); }
.chip.status-learning { background: var(--warning-soft); color: var(--warning); }
.chip.status-known    { background: var(--success-soft); color: var(--success); }
.chip.status-due      { background: var(--accent-soft); color: var(--accent-deep); }

/* ====== Flashcard ====== */
.fc-stage {
  display: grid;
  place-items: center;
  min-height: 420px;
  perspective: 1200px;
  padding: 20px 0 30px;
}
.fc {
  width: min(560px, 100%);
  height: 340px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0.05, 0.2, 1);
  cursor: pointer;
}
.fc.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute;
  inset: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  backface-visibility: hidden;
  box-shadow: var(--shadow-md);
}
.fc-back { transform: rotateY(180deg); }
.fc-front .word {
  font-family: var(--font-serif);
  font-size: 3.2rem;
  font-weight: 400;
  font-variation-settings: "opsz" 100, "SOFT" 50;
  text-align: center;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 12px;
}
.fc-front .pron {
  text-align: center;
  font-family: var(--font-mono);
  color: var(--ink-3);
  font-size: 0.95rem;
}
.fc-front .tap {
  position: absolute;
  bottom: 18px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.fc-back .lang-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 18px;
  margin-bottom: 18px;
}
.fc-back .lang-col .lbl {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.fc-back .lang-col .val {
  font-size: 1.15rem;
  color: var(--ink);
  font-weight: 500;
}
.fc-back .lang-col.fi .val { font-family: var(--font-serif); font-size: 1.4rem; }
.fc-back .lang-col.bn .val { font-family: var(--font-bn); }
.fc-back .example {
  border-top: 1px dashed var(--border);
  padding-top: 14px;
  margin-top: auto;
  font-size: 0.88rem;
  color: var(--ink-3);
}
.fc-back .example .ex-fi { font-family: var(--font-serif); color: var(--ink-2); font-style: italic; margin-bottom: 4px; }
.fc-back .example .ex-bn { font-family: var(--font-bn); margin-top: 4px; }

@media (max-width: 600px) {
  .fc-back .lang-grid { grid-template-columns: 1fr; gap: 10px; }
  .fc-front .word { font-size: 2.4rem; }
}

.fc-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
}
.fc-btn {
  flex: 1;
  max-width: 200px;
  padding: 14px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid;
}
.fc-btn.missed {
  background: var(--surface);
  color: var(--danger);
  border-color: var(--danger-soft);
}
.fc-btn.missed:hover { background: var(--danger-soft); }
.fc-btn.got {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.fc-btn.got:hover { background: #2A3145; }

.fc-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 560px;
  width: 100%;
  margin: 0 auto 16px;
  font-size: 0.85rem;
  color: var(--ink-3);
}

/* ====== Grammar rule cards ====== */
.rule {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  margin-bottom: 16px;
}
.rule-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 16px;
}
.rule-title { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 500; color: var(--ink); }
.rule-meta { display: flex; gap: 8px; align-items: center; }
.rule-section {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}
.rule-section .label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.example-row {
  display: grid;
  grid-template-columns: 1.5fr 1.5fr 1.5fr;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
}
.example-row:last-child { border-bottom: none; }
.example-row .fi { font-family: var(--font-serif); color: var(--ink); font-weight: 500; }
.example-row .bn { font-family: var(--font-bn); color: var(--ink-2); }
.example-row .en { color: var(--ink-2); font-style: italic; }
@media (max-width: 700px) {
  .example-row { grid-template-columns: 1fr; gap: 4px; padding: 12px 0; }
}

.callout {
  padding: 14px 16px;
  border-radius: var(--r-md);
  border-left: 3px solid;
  font-size: 0.92rem;
}
.callout.tip      { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.callout.mistake  { background: var(--warning-soft); border-color: var(--warning); color: var(--warning); }
.callout.analogy  { background: var(--ember-soft); border-color: var(--ember); color: var(--ember-deep); }
.callout .label {
  font-weight: 700;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.85;
}

/* ====== Modal ====== */

<script type="module">
/* ============================================================
   FINN.LAB — Application
   ============================================================ */

/* ---------- Constants ---------- */
const LEVELS = ['0', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
const LEVEL_ORDER = Object.fromEntries(LEVELS.map((l, i) => [l, i]));
const FI_WEEKDAYS = ['sunnuntai','maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai'];
const FI_MONTHS = ['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'];
const EN_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EN_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const NAV = [
  { section: 'Learn', items: [
    { id: 'dashboard',  label: 'Dashboard',   icon: 'home' },
    { id: 'vocabulary', label: 'Vocabulary',  icon: 'cards' },
    { id: 'grammar',    label: 'Grammar',     icon: 'book' },

  ]},
  { section: 'System', items: [
    { id: 'settings',   label: 'Settings',    icon: 'gear' },
  ]},
];

const ICONS = {
  home:    '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H10v7H5a1 1 0 0 1-1-1V11"/>',
  cards:   '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  book:    '<path d="M4 4a2 2 0 0 1 2-2h12v18H6a2 2 0 0 0-2 2V4z"/><path d="M4 22a2 2 0 0 1 2-2h12"/>',
  reading: '<path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/>',
  pen:     '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>',
  archive: '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
  link:    '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>',
  gear:    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};

const icon = (name, size = 18) =>
  `<svg class="nav-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;

/* ---------- IndexedDB ---------- */
const DB_NAME = 'finnlab';
const DB_VERSION = 1;
const STORES = ['vocabulary', 'grammar', 'sources', 'sessions', 'settings'];

let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach(name => {
        if (!db.objectStoreNames.contains(name)) {
          const opts = (name === 'settings') ? { keyPath: 'key' } : { keyPath: 'id' };
          db.createObjectStore(name, opts);
        }
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function tx(store, mode = 'readonly') {
  const db = await openDB();
  return db.transaction(store, mode).objectStore(store);
}

const db = {
  async getAll(store) {
    return new Promise(async (res, rej) => {
      const s = await tx(store);
      const r = s.getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },
  async get(store, key) {
    return new Promise(async (res, rej) => {
      const s = await tx(store);
      const r = s.get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async put(store, obj) {
    return new Promise(async (res, rej) => {
      const s = await tx(store, 'readwrite');
      const r = s.put(obj);
      r.onsuccess = () => res(obj);
      r.onerror = () => rej(r.error);
    });
  },
  async delete(store, key) {
    return new Promise(async (res, rej) => {
      const s = await tx(store, 'readwrite');
      const r = s.delete(key);
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },
  async clear(store) {
    return new Promise(async (res, rej) => {
      const s = await tx(store, 'readwrite');
      const r = s.clear();
      r.onsuccess = () => res();
      r.onerror = () => rej(r.error);
    });
  },
};

/* settings is a key-value store: { key, value } */
async function getSetting(key, fallback = null) {
  const row = await db.get('settings', key);
  return row ? row.value : fallback;
}
async function setSetting(key, value) {
  return db.put('settings', { key, value });
}

/* ---------- App State ---------- */
const state = {
  route: 'dashboard',
  level: 'A2',
  streak: 0,
  studyDates: [],
  totalReviews: 0,
  apiKey: '',
  apiProvider: 'anthropic',
  vocabulary: [],
  grammar: [],
  sources: [],
};

/* ---------- Utilities ---------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function uid(prefix = 'x') { return prefix + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function now() { return Date.now(); }
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateEN(d) {
  return `${EN_WEEKDAYS[d.getDay()]}, ${d.getDate()} ${EN_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateFI(d) {
  return `${FI_WEEKDAYS[d.getDay()]}, ${d.getDate()}. ${FI_MONTHS[d.getMonth()]}ta ${d.getFullYear()}`;
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toast-root').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 2400);
}

function levelChipHtml(level) {
  return `<span class="chip level-${level}">${level}</span>`;
}

/* ---------- Modal system ---------- */
let modalOpen = false;
function openModal({ title, body, footer, onClose }) {
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" data-close>
      <div class="modal" data-stop>
        <div class="modal-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="modal-close" data-close aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
      </div>
    </div>`;
  modalOpen = true;
  root.querySelector('[data-stop]').addEventListener('click', e => e.stopPropagation());
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => closeModal(onClose)));
  document.addEventListener('keydown', escClose);
}
function closeModal(cb) {
  $('#modal-root').innerHTML = '';
  modalOpen = false;
  document.removeEventListener('keydown', escClose);
  if (cb) cb();
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }


/* ---------- SM-2 algorithm ----------
   Quality scale: 0-5. We use:
     Got it → 4 (correct, with hesitation)
     Missed → 1 (incorrect, but familiar)
   Standard SuperMemo-2 implementation.
*/
function sm2Update(card, quality) {
  let { ef = 2.5, interval = 0, reps = 0 } = card;
  if (quality < 3) {
    reps = 0;
    interval = 1;
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ef);
    reps += 1;
  }
  ef = Math.max(1.3, ef + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  const nextReview = Date.now() + interval * 24 * 60 * 60 * 1000;
  return { ef: +ef.toFixed(2), interval, reps, nextReview, lastReview: Date.now() };
}

function cardStatus(card) {
  if (!card.reps || card.reps === 0) return 'new';
  if (card.reps >= 3 && card.interval >= 14) return 'known';
  if (card.nextReview && card.nextReview <= Date.now()) return 'due';
  return 'learning';
}

function dueToday(card) {
  if (!card.lastReview) return true;
  return (card.nextReview || 0) <= Date.now();
}

/* ---------- Streak tracking ---------- */
async function recordStudyDay() {
  const t = today();
  const dates = await getSetting('studyDates', []);
  if (dates.includes(t)) {
    state.streak = computeStreak(dates);
    return;
  }
  dates.push(t);
  await setSetting('studyDates', dates);
  state.studyDates = dates;
  state.streak = computeStreak(dates);
  renderStreak();
}
function computeStreak(dates) {
  const set = new Set(dates);
  let count = 0;
  const d = new Date();
  while (true) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (set.has(key)) { count++; d.setDate(d.getDate() - 1); }
    else break;
  }
  // Allow yesterday if today not yet studied
  if (count === 0) {
    d.setDate(d.getDate() - 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (set.has(key)) {
      let dd = new Date(d);
      while (true) {
        const k = `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
        if (set.has(k)) { count++; dd.setDate(dd.getDate() - 1); }
        else break;
      }
    }
  }
  return count;
}

/* ---------- Router ---------- */
async function navigate(route) {
  state.route = route;
  if (location.hash !== '#' + route) history.pushState(null, '', '#' + route);
  renderNav();
  await renderView();
  document.documentElement.scrollTop = 0;
  $('.app-main').scrollTop = 0;
}
window.addEventListener('popstate', () => {
  const r = (location.hash || '#dashboard').slice(1);
  state.route = r;
  renderNav();
  renderView();
});

/* ---------- Render: header level bar ---------- */
function renderLevelBar() {
  const el = $('#level-bar');
  el.innerHTML = LEVELS.map(l =>
    `<button class="level-chip ${l === state.level ? 'active' : ''}" data-level="${l}" role="tab">${l}</button>`
  ).join('');
  el.querySelectorAll('.level-chip').forEach(btn => {
    btn.addEventListener('click', async () => {
      state.level = btn.dataset.level;
      await setSetting('currentLevel', state.level);
      renderLevelBar();
      renderView();
    });
  });
}

function renderStreak() {
  $('#streak-count').textContent = state.streak;
}

/* ---------- Render: navigation ---------- */
function renderNav() {
  const desktopHtml = NAV.map(group => `
    <div class="nav-section-title">${group.section}</div>
    ${group.items.map(it => `
      <button class="nav-item ${state.route === it.id ? 'active' : ''}" data-route="${it.id}">
        ${icon(it.icon)}
        <span>${it.label}</span>
      </button>
    `).join('')}
  `).join('');
  $('#desktop-nav').innerHTML = desktopHtml;
  $$('#desktop-nav .nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.route)));

  const mobileItems = NAV.flatMap(g => g.items).filter(i => ['dashboard','vocabulary','grammar','vault','settings'].includes(i.id));
  $('#mobile-nav').innerHTML = mobileItems.map(it => `
    <button class="nav-item ${state.route === it.id ? 'active' : ''}" data-route="${it.id}">
      ${icon(it.icon, 22)}
      <span>${it.label}</span>
    </button>
  `).join('');
  $$('#mobile-nav .nav-item').forEach(b => b.addEventListener('click', () => navigate(b.dataset.route)));
}

/* ---------- Filtering by level ---------- */
function filterByLevel(items) {
  if (!items) return [];
  return items.filter(it => it.level === state.level);
}

/* ---------- Views: registry ---------- */

  const root = $('#view-root');

  const html = await fn();
  root.innerHTML = `<div class="page">${html}</div>`;
  if (views[state.route + '_bind']) views[state.route + '_bind']();
}

function renderStudyMode(words) {
  if (words.length === 0) {
    return `<div class="empty">
      <div class="em-icon">∅</div>
      <h3>No words at level ${state.level} yet</h3>
      <p>Add your first word to start studying with flashcards. The system will learn what you know and resurface what you've missed.</p>
      <button class="btn btn-primary" data-action="add-word">+ Add your first word</button>
    </div>`;
  }
  // Build queue: due cards first, then new cards, then learning
  if (studyQueue.length === 0 || studyIndex >= studyQueue.length) {
    studyQueue = [...words].sort((a, b) => {
      const aDue = dueToday(a) ? 0 : 1;
      const bDue = dueToday(b) ? 0 : 1;
      if (aDue !== bDue) return aDue - bDue;
      return (a.nextReview || 0) - (b.nextReview || 0);
    });
    studyIndex = 0;
    cardFlipped = false;
  }
  const card = studyQueue[studyIndex];
  if (!card) {
    return `<div class="empty">
      <div class="em-icon">✓</div>
      <h3>Session complete — hyvää työtä!</h3>
      <p>You've reviewed every card in this queue. Take a break or browse your vocabulary.</p>
      <button class="btn btn-secondary" data-mode="list">Browse list</button>
    </div>`;
  }

  return `
    <div class="fc-meta">
      <span>Card ${studyIndex + 1} of ${studyQueue.length}</span>
      <span>${levelChipHtml(card.level)} <span class="chip status-${cardStatus(card)}" style="margin-left:6px">${cardStatus(card)}</span></span>
    </div>
    <div class="fc-stage">
      <div class="fc ${cardFlipped ? 'flipped' : ''}" id="flashcard">
        <div class="fc-face fc-front">
          <div class="word">${escapeHtml(card.fi)}</div>
          ${card.pronunciation ? `<div class="pron">/${escapeHtml(card.pronunciation)}/</div>` : ''}
          <div class="tap">Tap to reveal</div>
        </div>
        <div class="fc-face fc-back">
          <div class="lang-grid">
            <div class="lang-col fi">
              <div class="lbl">Suomi · FI</div>
              <div class="val">${escapeHtml(card.fi)}</div>
            </div>
            <div class="lang-col en">
              <div class="lbl">English · EN</div>
              <div class="val">${escapeHtml(card.en)}</div>
            </div>
            <div class="lang-col bn">
              <div class="lbl">বাংলা · BN</div>
              <div class="val">${escapeHtml(card.bn || '—')}</div>
            </div>
          </div>
          ${card.example_fi ? `
            <div class="example">
              <div class="ex-fi">${escapeHtml(card.example_fi)}</div>
              <div>${escapeHtml(card.example_en || '')}</div>
              ${card.example_bn ? `<div class="ex-bn">${escapeHtml(card.example_bn)}</div>` : ''}
            </div>
          ` : ''}
        </div>
      </div>
    </div>
    ${cardFlipped ? `
      <div class="fc-controls">
        <button class="fc-btn missed" data-rate="missed">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Missed
        </button>
        <button class="fc-btn got" data-rate="got">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>
          Got it
        </button>
      </div>
    ` : `<div class="fc-controls"><button class="btn btn-secondary" data-action="flip">Reveal answer</button></div>`}
    <div class="center muted small" style="margin-top:18px">
      <button class="btn btn-ghost btn-sm" data-action="edit-card" data-id="${card.id}">Edit</button>
      <button class="btn btn-ghost btn-sm" data-action="skip">Skip</button>
    </div>
  `;
}

function bindStudyMode() {
  const fc = $('#flashcard');
  if (fc) fc.addEventListener('click', () => { cardFlipped = !cardFlipped; renderView(); });
  $$('[data-action="flip"]').forEach(b => b.addEventListener('click', () => { cardFlipped = true; renderView(); }));
  $$('[data-rate]').forEach(b => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    const rate = b.dataset.rate;
    const card = studyQueue[studyIndex];
    const quality = rate === 'got' ? 4 : 1;
    const upd = sm2Update(card, quality);
    const merged = { ...card, ...upd, updated: now() };
    await db.put('vocabulary', merged);
    state.totalReviews++;
    await setSetting('totalReviews', state.totalReviews);
    await recordStudyDay();
    studyIndex++;
    cardFlipped = false;
    if (rate === 'got') toast('Got it ✓', 'success');
    renderView();
  }));
  $$('[data-action="skip"]').forEach(b => b.addEventListener('click', () => {
    studyIndex++; cardFlipped = false; renderView();
  }));
  $$('[data-action="edit-card"]').forEach(b => b.addEventListener('click', () => openWordEditor(b.dataset.id)));
}

function exportGrammarAsBook() {
  const rules = [...state.grammar].sort((a, b) => {
    const c = (a.chapter || 'zz').localeCompare(b.chapter || 'zz');
    if (c !== 0) return c;
    return (a.order ?? 99) - (b.order ?? 99);
  });
  const chapters = {};
  rules.forEach(r => {
    const ch = r.chapter || 'Uncategorized';
    if (!chapters[ch]) chapters[ch] = [];
    chapters[ch].push(r);
  });
  let md = `# Finn.Lab — Finnish Grammar for Bengali Speakers\n\n*Auto-exported from Finn.Lab on ${fmtDateEN(new Date())}.*\n\n---\n\n`;
  Object.keys(chapters).forEach(ch => {
    md += `## Chapter: ${ch}\n\n`;
    chapters[ch].forEach((r, i) => {
      md += `### ${i+1}. ${r.title}  \n*Level: ${r.level}*\n\n`;
      if (r.explanation_en) md += `**Explanation (English)**  \n${r.explanation_en}\n\n`;
      if (r.explanation_bn) md += `**ব্যাখ্যা (বাংলা)**  \n${r.explanation_bn}\n\n`;
      if (r.examples?.length) {
        md += `**Examples:**\n\n`;
        md += `| Finnish | English | বাংলা |\n|---|---|---|\n`;
        r.examples.forEach(ex => { md += `| ${ex.fi || ''} | ${ex.en || ''} | ${ex.bn || ''} |\n`; });
        md += `\n`;
      }
      if (r.tips) md += `> **Tip:** ${r.tips}\n\n`;
      if (r.commonMistakes) md += `> **Common mistakes:** ${r.commonMistakes}\n\n`;
      if (r.analogy) md += `> **Memory trick:** ${r.analogy}\n\n`;
      md += `---\n\n`;
    });
  });
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finnlab-grammar-${today()}.md`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${rules.length} rules as Markdown ✓`, 'success');
}

async function exportAllData() {
  const data = {
    exportedAt: new Date().toISOString(),
    version: 1,
    vocabulary: await db.getAll('vocabulary'),
    grammar: await db.getAll('grammar'),
    sources: await db.getAll('sources'),
    sessions: await db.getAll('sessions'),
    settings: await db.getAll('settings'),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `finnlab-backup-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded ✓', 'success');
}

async function importAllData(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.version) throw new Error('Not a valid Finn.Lab backup');
    if (!confirm(`Import ${data.vocabulary?.length || 0} words, ${data.grammar?.length || 0} rules, ${data.sources?.length || 0} sources? Existing items with the same ID will be overwritten.`)) return;
    for (const v of (data.vocabulary || [])) await db.put('vocabulary', v);
    for (const g of (data.grammar || [])) await db.put('grammar', g);
    for (const s of (data.sources || [])) await db.put('sources', s);
    for (const st of (data.settings || [])) await db.put('settings', st);
    await loadAllState();
    toast('Import complete ✓', 'success');
    renderView();
  } catch (err) {
    toast('Import failed: ' + err.message, 'error');
  }
  e.target.value = '';
}

async function resetProgress() {
  if (!confirm('Reset progress?\n\nThis will clear: streak, review history, and card learning status.\nThis will NOT touch: vocabulary, grammar rules, or sources.')) return;
  const allVocab = await db.getAll('vocabulary');
  for (const v of allVocab) {
    v.ef = 2.5; v.interval = 0; v.reps = 0; v.nextReview = null; v.lastReview = null;
    await db.put('vocabulary', v);
  }
  await setSetting('studyDates', []);
  await setSetting('totalReviews', 0);
  state.streak = 0; state.studyDates = []; state.totalReviews = 0;
  renderStreak();
  toast('Progress reset · Vault preserved', 'success');
  renderView();
}

async function eraseAll() {
  if (!confirm('Erase ALL data? This deletes vocabulary, grammar, sources, and settings.\nThis CANNOT be undone.')) return;
  if (!confirm('Are you absolutely sure?')) return;
  for (const s of STORES) await db.clear(s);
  toast('All data erased');
  setTimeout(() => location.reload(), 800);
}


/* ====================================================
   AI integration
   ==================================================== */
async function aiCall(prompt, system) {
  if (!state.apiKey) throw new Error('No API key configured');
  if (state.apiProvider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1024,
        system: system || 'You are a helpful Finnish language tutor. Be concise and accurate.',
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err.slice(0, 120)}`);
    }
    const data = await res.json();
    return data.content?.[0]?.text || '';
  } else {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.apiKey}`,
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [
          { role: 'system', content: system || 'You are a helpful Finnish language tutor. Be concise and accurate.' },
          { role: 'user', content: prompt },
        ],
        max_tokens: 1024,
      }),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(`HTTP ${res.status}: ${err.slice(0, 120)}`);
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  }
}

/* ====================================================
   "Ask about this" — text-selection feature
   ==================================================== */
let askPopEl = null;
let askLastSelection = '';

document.addEventListener('mouseup', (e) => {
  // Only on main content
  if (!e.target.closest('.app-main') && !e.target.closest('.modal')) return;
  setTimeout(handleSelection, 10);
});
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.toString().trim().length === 0) hideAskPop();
});
function handleSelection() {
  const sel = window.getSelection();
  const txt = sel?.toString().trim();
  if (!txt || txt.length < 2 || txt.length > 240) { hideAskPop(); return; }
  // Only show if selection is within app-main
  if (!sel.anchorNode || !sel.anchorNode.parentElement) return;
  const inMain = sel.anchorNode.parentElement.closest('.app-main') || sel.anchorNode.parentElement.closest('.modal');
  if (!inMain) { hideAskPop(); return; }
  askLastSelection = txt;
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  showAskPop(rect, txt);
}
function showAskPop(rect, text) {
  hideAskPop();
  const el = document.createElement('div');
  el.className = 'ask-pop';
  el.innerHTML = `
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-.8.5-1.5 1-1.5 2"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
    Ask about "${text.length > 24 ? text.slice(0, 24) + '…' : escapeHtml(text)}"
  `;
  el.style.top = (window.scrollY + rect.top - 44) + 'px';
  el.style.left = (window.scrollX + rect.left + rect.width / 2) + 'px';
  el.addEventListener('click', () => { hideAskPop(); openAskModal(text); });
  $('#ask-pop-root').appendChild(el);
  askPopEl = el;
}
function hideAskPop() {
  if (askPopEl) { askPopEl.remove(); askPopEl = null; }
}

async function openAskModal(text) {
  openModal({
    title: 'Ask about: ' + (text.length > 40 ? text.slice(0, 40) + '…' : text),
    body: `
      <div class="callout tip" style="margin-bottom:14px">
        <div class="label">Selection</div>
        <div style="font-family:var(--font-serif);font-size:1.05rem;color:var(--ink)">${escapeHtml(text)}</div>
      </div>
      ${!state.apiKey ? `
        <p>To explain selections with AI, add your API key in Settings.</p>
        <button class="btn btn-accent" data-nav="settings" data-close>Open Settings</button>
      ` : `
        <div id="ask-result"><div class="row gap-sm muted"><span class="spinner"></span> Asking Finn.Lab AI…</div></div>
      `}
    `,
    footer: state.apiKey ? `<button class="btn btn-ghost" data-close>Close</button>` : '',
  });
  $$('[data-nav]').forEach(a => a.addEventListener('click', () => { closeModal(); navigate(a.dataset.nav); }));
  if (state.apiKey) {
    try {
      const reply = await aiCall(
        `A Finnish learner has selected this text: "${text}"\n\nExplain it in English. Cover:\n1. Translation (English + Bangla if possible)\n2. Word-by-word breakdown if it's a phrase\n3. Grammar notes (case, conjugation, etc.)\n4. A natural usage example\n\nBe concise but thorough.`,
        'You are a patient Finnish tutor explaining things to an English-speaking learner who also reads Bangla. Use markdown. Keep it under 250 words.'
      );
      const out = $('#ask-result');
      if (out) {
        // Light markdown rendering: **bold** and \n
        const html = escapeHtml(reply)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code class="mono">$1</code>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        out.innerHTML = `<div style="line-height:1.65"><p>${html}</p></div>`;
      }
    } catch (err) {
      $('#ask-result').innerHTML = `<div class="callout mistake"><div class="label">Error</div>${escapeHtml(err.message)}</div>`;
    }
  }
}

      { fi: 'talo → talossa',     en: 'house → in the house (back vowels: a, o)',   bn: 'বাড়ি → বাড়িতে (পশ্চাৎ স্বর)' },
      { fi: 'metsä → metsässä',   en: 'forest → in the forest (front vowels: ä)',    bn: 'বন → বনে (সামনের স্বর)' },
      { fi: 'kirja → kirjassa',   en: 'book → in the book (neutral i + back a)',     bn: 'বই → বইয়ে' },
    ],
    tips: 'Look at the LAST non-neutral vowel in the stem. If it\'s back (a, o, u), the suffix uses back vowels. If it\'s front (ä, ö, y), use front. If everything is neutral (only e, i), default to front.',
    commonMistakes: 'Mixing harmony in a single word — writing "metsassa" instead of "metsässä" — is the most common beginner error. Always check the base word\'s vowels first.',
    analogy: 'Vowel harmony is like a dress code at a Finnish party. Back vowels are wearing black, front vowels are wearing white. You can\'t mix the two within one outfit (one word). The neutral vowels (e, i) are the ones who showed up in jeans and can hang with either group.',
  },
];

async function seedIfEmpty() {
  const vocab = await db.getAll('vocabulary');
  if (vocab.length === 0) {
    for (const w of SEED_VOCAB) {
      await db.put('vocabulary', {
        id: uid('v'),
        ef: 2.5, interval: 0, reps: 0, nextReview: null, lastReview: null,
        created: now(), updated: now(),
        ...w,
      });
    }
  }
  const gram = await db.getAll('grammar');
  if (gram.length === 0) {
    for (const r of SEED_GRAMMAR) {
      await db.put('grammar', {
        id: uid('g'),
        created: now(), updated: now(),
        explanation_bn: '', tips: '', commonMistakes: '', analogy: '',
        ...r,
      });
    }
  }
}

/* ====================================================
   Boot
   ==================================================== */
async function loadAllState() {
  state.level = await getSetting('currentLevel', 'A2');
  state.apiKey = await getSetting('apiKey', '');
  state.apiProvider = await getSetting('apiProvider', 'anthropic');
  state.studyDates = await getSetting('studyDates', []);
  state.totalReviews = await getSetting('totalReviews', 0);
  state.streak = computeStreak(state.studyDates);
  state.vocabulary = await db.getAll('vocabulary');
  state.grammar = await db.getAll('grammar');
  state.sources = await db.getAll('sources');
}

async function boot() {
  try {
    await openDB();
    await seedIfEmpty();
    await loadAllState();
    const initialRoute = (location.hash || '#dashboard').slice(1);
    state.route = NAV.flatMap(g => g.items).some(i => i.id === initialRoute) ? initialRoute : 'dashboard';
    renderLevelBar();
    renderStreak();
    renderNav();
    await renderView();
  } catch (err) {
    console.error(err);
    $('#view-root').innerHTML = `<div class="page"><div class="callout mistake"><div class="label">Boot error</div>${escapeHtml(err.message)}</div></div>`;
  }
}

boot();

</script>
