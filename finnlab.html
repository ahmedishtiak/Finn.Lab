<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinnLab · Trilingual Finnish (FI · EN · BN) — YKI 3 → YKI 4</title>
  <meta name="description" content="A trilingual Finnish learning dashboard for YKI 3 and YKI 4 preparation. Finnish + English + Bangla. Spaced repetition, grammar drills, reading, listening, writing with self-grading, YKI mock tasks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; background: #FAF8F3; }
    body { font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif; color: #0E1F35; }
    #root { min-height: 100vh; }
    .loading-shell { padding: 60px 40px; }
    .loading-shell .title { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 500; letter-spacing: -0.02em; }
    .loading-shell .rule { width: 28px; height: 1px; background: #B08C5C; margin: 14px 0; }
    .loading-shell .sub { font-size: 14px; color: #6B7888; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-shell">
      <div class="title">FinnLab</div>
      <div class="rule"></div>
      <div class="sub">Loading your dashboard…</div>
    </div>
  </div>

  <script>
    // window.storage shim — use localStorage when the artifact API isn't present
    if (!window.storage) {
      window.storage = {
        async get(key) {
          const v = localStorage.getItem(key);
          return v !== null ? { key: key, value: v, shared: false } : null;
        },
        async set(key, value) {
          try { localStorage.setItem(key, value); return { key: key, value: value, shared: false }; }
          catch(e) { console.error('storage.set failed', e); return null; }
        },
        async delete(key) {
          const had = localStorage.getItem(key) !== null;
          localStorage.removeItem(key);
          return { key: key, deleted: had, shared: false };
        },
        async list(prefix) {
          prefix = prefix || '';
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(prefix) === 0) keys.push(k);
          }
          return { keys: keys, prefix: prefix, shared: false };
        }
      };
    }
  </script>

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&display=swap');

  :root {
    --bg: #FAF8F3;
    --paper: #FFFFFF;
    --ink: #0E1F35;
    --ink-2: #3A4A5E;
    --ink-3: #6B7888;
    --line: #E5E0D5;
    --line-2: #EFEAE0;
    --accent: #B08C5C;
    --accent-2: #8A6B3F;
    --green: #2D5F3F;
    --green-bg: #E8F0E9;
    --red: #8B2C2C;
    --red-bg: #F4E5E5;
    --amber: #B85C00;
    --amber-bg: #F8EFE0;
  }

  .fnt-display { font-family: 'Fraunces', Georgia, serif; font-feature-settings: 'ss01', 'ss02'; letter-spacing: -0.01em; }
  .fnt-body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .fnt-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .fnt-bn { font-family: 'Noto Sans Bengali', 'IBM Plex Sans', sans-serif; }

  body, .fl-root { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; }

  .fl-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
  .fl-divider { border-top: 1px solid var(--line); }
  .fl-hairline { border-bottom: 1px solid var(--line); }

  .fl-btn { font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.02em; padding: 8px 14px; border-radius: 3px; transition: all 0.15s ease; cursor: pointer; border: 1px solid transparent; }
  .fl-btn-primary { background: var(--ink); color: #FAF8F3; }
  .fl-btn-primary:hover { background: #1A3050; }
  .fl-btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .fl-btn-ghost:hover { background: var(--line-2); }
  .fl-btn-accent { background: var(--accent); color: white; }
  .fl-btn-accent:hover { background: var(--accent-2); }

  .fl-tab { padding: 10px 14px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-left: 2px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
  .fl-tab:hover { color: var(--ink); background: var(--line-2); }
  .fl-tab-active { color: var(--ink); border-left-color: var(--accent); background: var(--line-2); }

  .fl-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 2px; font-weight: 500; }
  .fl-chip-accent { background: var(--accent); color: white; border-color: var(--accent); }
  .fl-chip-green { background: var(--green-bg); color: var(--green); border-color: #C8DCC9; }
  .fl-chip-red { background: var(--red-bg); color: var(--red); border-color: #E0C8C8; }
  .fl-chip-amber { background: var(--amber-bg); color: var(--amber); border-color: #E8D5B0; }

  .fl-input { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; padding: 9px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 3px; width: 100%; color: var(--ink); }
  .fl-input:focus { outline: none; border-color: var(--ink); }

  .fl-textarea { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.65; padding: 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 3px; width: 100%; color: var(--ink); resize: vertical; }
  .fl-textarea:focus { outline: none; border-color: var(--ink); }

  .fl-numeric { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .fl-rule { width: 28px; height: 1px; background: var(--accent); display: block; margin: 12px 0; }

  .fl-link { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .fl-link:hover { color: var(--accent-2); }

  .fl-cell-hover:hover { background: var(--line-2); }

  /* spinner-free scrollbar refinement */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

 He puhuvat suomea ja englantia. Yksi asiakas on Espoosta. H\xE4n tilaa joka p\xE4iv\xE4 mustan kahvin ja korvapuustin. Min\xE4 pid\xE4n ty\xF6st\xE4ni.",qs:[{q:"Where is the caf\xE9? / Miss\xE4 kahvila on?",opts:["Espoossa","Helsingiss\xE4, asemalla","Tampereella"],correct:1},{q:"What does the regular customer order?",opts:["Coffee with milk","Black coffee and a korvapuusti","Tea and cake"],correct:1},{q:"How does Liisa feel about her work?",opts:["She dislikes it","She likes it","It is unclear"],correct:1}]},{id:"a1-r2",title:"Minun perhe",titleEn:"My family",text:"Minun nimi on Aamir. Min\xE4 asun Espoossa. Minulla on vaimo ja kaksi lasta. Vaimon nimi on Sara. Lapset k\xE4yv\xE4t koulussa. Vanhempi lapsi puhuu jo hyvin suomea. Nuorempi lapsi puhuu vain bengalia ja v\xE4h\xE4n englantia. Me sy\xF6mme aamulla yhdess\xE4. Sitten min\xE4 menen t\xF6ihin ja lapset menev\xE4t kouluun.",qs:[{q:"How many children does Aamir have?",opts:["One","Two","Three"],correct:1},{q:"Which child speaks Finnish well?",opts:["The younger","The older","Both"],correct:1},{q:"What does the family do in the morning?",opts:["Goes shopping","Eats breakfast together","Watches TV"],correct:1}]}],A2:[{id:"a2-r1",title:"Bussimatka Helsinkiin",titleEn:"A bus trip to Helsinki",text:"Eilen aamulla menin Helsinkiin bussilla. Bussi l\xE4hti Espoosta kello kahdeksan. Matka kesti noin kolmekymment\xE4 minuuttia. Bussi oli t\xE4ynn\xE4 ihmisi\xE4. Helsingiss\xE4 k\xE4vin pankissa ja sen j\xE4lkeen kahvilassa. S\xF6in korvapuustin ja join kahvia. Kahvi oli kallis mutta hyv\xE4. Iltap\xE4iv\xE4ll\xE4 palasin kotiin. Olin v\xE4synyt mutta tyytyv\xE4inen.",qs:[{q:"When did the bus leave?",opts:["Klo 7","Klo 8","Klo 9"],correct:1},{q:"How long was the trip?",opts:["~30 minutes","~1 hour","~2 hours"],correct:0},{q:"Where did the writer go first in Helsinki?",opts:["Caf\xE9","Bank","Park"],correct:1},{q:"How did the writer feel afterwards?",opts:["Tired but satisfied","Angry","Confused"],correct:0}]},{id:"a2-r2",title:"S\xE4\xE4 t\xE4n\xE4\xE4n",titleEn:"The weather today",text:"T\xE4n\xE4\xE4n Etel\xE4-Suomessa on pilvist\xE4. Helsingiss\xE4 sataa vett\xE4 iltap\xE4iv\xE4ll\xE4. L\xE4mp\xF6tila on noin viisi astetta. Tuuli on kova. Pohjois-Suomessa on kylmemp\xE4\xE4. Lapissa sataa lunta ja l\xE4mp\xF6tila on miinus kymmenen. Huomenna s\xE4\xE4 paranee koko maassa. Aurinko paistaa ja tuuli heikkenee.",qs:[{q:"What is the weather like in Helsinki today?",opts:["Sunny","Cloudy and rainy in the afternoon","Snowy"],correct:1},{q:"Temperature in Lapland today?",opts:["+5\xB0C","\u221210\xB0C","0\xB0C"],correct:1},{q:"What about tomorrow?",opts:["Same as today","Worse","Better, sunny"],correct:2}]}],B1:[{id:"b1-r1",title:"Selkouutiset: Asuntojen hinnat",titleEn:"Easy News: Apartment prices",text:"Asuntojen hinnat ovat nousseet p\xE4\xE4kaupunkiseudulla viime vuonna. Erityisesti pienten asuntojen hinnat ovat kalliimpia. Asiantuntijoiden mukaan syy on se, ett\xE4 pieni\xE4 asuntoja tarvitaan paljon. Helsingiss\xE4 yksi\xF6n keskihinta on nyt yli kaksisataatuhatta euroa. Espoossa ja Vantaalla hinnat ovat hieman halvempia mutta nekin ovat nousseet. Moni nuori haluaa ostaa oman asunnon mutta laina-aika voi olla pitk\xE4. Pankit antavat lainaa, jos hakijalla on vakaa ty\xF6paikka.",qs:[{q:"What has happened to apartment prices in the capital area?",opts:["Dropped sharply","Risen, especially small apartments","Stayed flat"],correct:1},{q:"Why are small apartments expensive?",opts:["Few are being built","They are in high demand","Article does not say"],correct:1},{q:"What do banks require for a loan?",opts:["Family guarantor","A stable job","Down payment of 50%"],correct:1},{q:"How do Espoo prices compare to Helsinki?",opts:["Higher","Slightly lower but also rising","Much lower"],correct:1}]},{id:"b1-r2",title:"S\xE4hk\xF6posti esimiehelle",titleEn:"Email to a supervisor",text:`Hei Marja,

Ishtiak`,qs:[{q:"What does Ishtiak propose?",opts:["Cancel the project","Delay the report by two weeks","Hire more staff"],correct:1},{q:"Why does he propose this?",opts:["Holiday season","Client asked for more information","Budget cuts"],correct:1},{q:"What will he do tomorrow if approved?",opts:["Inform the client only","Send an updated plan","Schedule another meeting"],correct:1}]},{id:"b1-r3",title:"Selkouutiset: Suomi ja kotoutuminen",titleEn:"Easy News: Finland and integration",text:"Suomeen muuttaa joka vuosi paljon ihmisi\xE4 eri maista. Monet tulevat ty\xF6n takia, jotkut opiskelemaan ja toiset perheen per\xE4ss\xE4. Kotoutuminen tarkoittaa sit\xE4, ett\xE4 uusi asukas oppii suomalaista yhteiskuntaa, kielt\xE4 ja ty\xF6el\xE4m\xE4\xE4. Kunnat tarjoavat suomen kielen kursseja ja neuvontaa. Kielitaito on t\xE4rkein asia, jos haluaa ty\xF6paikan. Monet ty\xF6nantajat vaativat v\xE4hint\xE4\xE4n B1-tason suomea, ja terveysalalla usein B2-tason.",qs:[{q:"Why do most people move to Finland?",opts:["Climate","Work, study, or family","Tourism"],correct:1},{q:"What is the most important factor for getting a job?",opts:["Education","Language skill","Age"],correct:1},{q:"What level is often required in healthcare?",opts:["A2","B1","B2"],correct:2}]}],B2:[{id:"b2-r1",title:"Pankkialan murros Pohjoismaissa",titleEn:"The banking sector transition in the Nordics",text:"Pohjoismainen pankkiala el\xE4\xE4 murroskautta. Digitalisaatio on nopeuttanut palveluiden siirtymist\xE4 verkkoon, ja konttoreiden m\xE4\xE4r\xE4 on v\xE4hentynyt selv\xE4sti viimeisen kymmenen vuoden aikana. Samalla s\xE4\xE4ntely on tiukentunut: rahanpesun est\xE4minen ja terrorismin rahoituksen torjunta edellytt\xE4v\xE4t pankeilta yh\xE4 j\xE4re\xE4mpi\xE4 prosesseja. Asiakkaan tunnistaminen, niin sanottu KYC-menettely, vie merkitt\xE4v\xE4n osan pankkitoimihenkil\xF6n ty\xF6ajasta. Asiantuntijoiden mukaan ammattilaisille, jotka osaavat sek\xE4 compliance-puolen ett\xE4 asiakaspalvelun, on kysynt\xE4\xE4. Erityisesti monikielisist\xE4 asiantuntijoista on pulaa.",qs:[{q:"What has digitalisation caused in Nordic banking?",opts:["More branches opened","Fewer branches; services moved online","No real change"],correct:1},{q:"What does KYC consume?",opts:["Customer fees","A significant share of banking staff time","Only IT resources"],correct:1},{q:"Who is in particular demand?",opts:["Branch tellers","Multilingual experts who understand compliance and service","Marketing staff"],correct:1},{q:"What has regulation done?",opts:["Loosened","Tightened, especially around AML/CTF","Stayed the same"],correct:1}]},{id:"b2-r2",title:"Mielipidekirjoitus: Kielitaito ja ty\xF6llistyminen",titleEn:"Opinion piece: Language skill and employability",text:"On hyvin puhuttu siit\xE4, ett\xE4 suomen kielen taito on portti suomalaisille ty\xF6markkinoille. T\xE4m\xE4 pit\xE4\xE4 suurelta osin paikkansa, mutta keskustelussa unohdetaan usein kaksi seikkaa. Ensinn\xE4kin kansainv\xE4lisiss\xE4 yrityksiss\xE4 ty\xF6kielen\xE4 on usein englanti, ja moni asiantuntijateht\xE4v\xE4 on hoidettavissa ilman sujuvaa suomea. Toiseksi suomalaiset ty\xF6nantajat asettavat v\xE4lill\xE4 kielivaatimuksia, jotka eiv\xE4t ole ty\xF6teht\xE4v\xE4n kannalta perusteltuja. T\xE4m\xE4 rajoittaa erityisesti korkeakoulutettujen maahanmuuttajien ty\xF6llistymist\xE4. Ratkaisuksi tarvitaan sek\xE4 rohkeampaa rekrytointia ett\xE4 parempaa kielikoulutusta ty\xF6ss\xE4oppimisen rinnalla. Vain n\xE4in Suomen osaajapula saadaan ratkaistua.",qs:[{q:"What is the main claim of the writer?",opts:["Finnish skill is irrelevant","Finnish matters, but language requirements are sometimes excessive and harm immigrant employment","Only English matters"],correct:1},{q:"What two points does the writer say are forgotten?",opts:["Pay gaps and unions","English-language workplaces and unjustified language requirements","Climate and inflation"],correct:1},{q:"What does the writer propose?",opts:["Stricter language tests","Bolder hiring and better in-work language training","Importing fewer workers"],correct:1},{q:"How does the writer characterise the labour shortage?",opts:["As exaggerated","As solvable only via the proposed measures","As unrelated to language"],correct:1}]},{id:"b2-r3",title:"Yle-tyylinen artikkeli: Inflaatio ja kotitaloudet",titleEn:"Yle-style article: Inflation and households",text:"Inflaatio on hidastunut Suomessa viime kuukausina, mutta hintojen nousu painaa edelleen kotitalouksien arkea. Tilastokeskuksen mukaan ruoan hinta on noussut yli nelj\xE4 prosenttia vuoden aikana. Korkojen nousun vuoksi asuntolainojen hoitokulut ovat kasvaneet, mik\xE4 on v\xE4hent\xE4nyt kulutusvaraa. Pankit raportoivat, ett\xE4 useat asiakkaat ovat neuvotelleet lyhennyksiin joustoja. Suomen Pankki arvioi, ett\xE4 inflaatio jatkaa hidastumistaan, mutta palkkojen ja kuluttajahintojen tasapaino l\xF6ytyy vasta vuoden kuluttua.",qs:[{q:"What is happening to inflation?",opts:["Accelerating","Slowing, but prices still pressing households","Stable for a year"],correct:1},{q:"What about food prices in the past year?",opts:["Fell","Rose by over 4%","Unchanged"],correct:1},{q:"What have many bank customers done?",opts:["Increased savings","Negotiated flexibility on loan repayments","Switched banks"],correct:1},{q:"What does the Bank of Finland estimate?",opts:["Inflation will rise again","Balance between wages and prices in about a year","No further change"],correct:1}]}]},XL={A1:[{id:"a1-w1",type:"message",prompt:"Write a short self-introduction (4\u20135 sentences): name, where you live, job/study, languages, one hobby.",target:50,time:"~10 min"},{id:"a1-w2",type:"message",prompt:"Send a text to a friend: invite them to coffee on Saturday at 14:00. Mention the caf\xE9.",target:30,time:"~5 min"},{id:"a1-w3",type:"message",prompt:"Write a postcard from Helsinki: 4 sentences about your day.",target:40,time:"~8 min"}],A2:[{id:"a2-w1",type:"message",prompt:"Email a colleague: you cannot come to the meeting tomorrow because of a doctor's appointment. Apologise and suggest a new time.",target:70,time:"~10 min"},{id:"a2-w2",type:"message",prompt:"Write a short post for an apartment listing: 1 bedroom in Espoo, rent, what is included, contact info.",target:80,time:"~12 min"},{id:"a2-w3",type:"message",prompt:"Describe your last weekend in 6\u20138 sentences (use past tense / imperfekti).",target:90,time:"~15 min"}],B1:[{id:"b1-w1",type:"email",prompt:"Formal email to a bank: you noticed an unrecognised transaction on your account. Ask them to investigate, give the transaction date and amount, request a written response.",target:150,time:"~25 min"},{id:"b1-w2",type:"opinion",prompt:'Short opinion piece (150\u2013200 words): "Should companies require Finnish language skills for all jobs?" Give your view and two reasons.',target:180,time:"~30 min"},{id:"b1-w3",type:"message",prompt:"Write to your landlord: there is a problem with the heating. Describe the issue, when it started, and ask when it can be fixed.",target:120,time:"~20 min"},{id:"b1-w4",type:"message",prompt:"Application paragraph: introduce yourself for a customer-service role at a Finnish bank. Highlight your background, what you can offer, and why this employer.",target:150,time:"~25 min"}],B2:[{id:"b2-w1",type:"opinion",prompt:'Opinion essay (250\u2013300 words): "Should Finland make it easier for non-Finnish-speaking experts to obtain permanent residence?" Take a clear position, support it with two arguments, address a counter-argument.',target:280,time:"~45 min"},{id:"b2-w2",type:"formal",prompt:"Formal complaint letter (~250 words): to a service provider that failed to deliver a contracted service on time. Use formal register, include facts, demand a clear remedy.",target:250,time:"~40 min"},{id:"b2-w3",type:"report",prompt:"Work report (~250 words): summarise a project status. Include background, current state, risks, next steps. Use neutral, professional Finnish.",target:250,time:"~40 min"},{id:"b2-w4",type:"opinion",prompt:'YKI-style opinion task (~250 words): "Digitalisation is making banking services less accessible to elderly people." Discuss, argue, conclude.',target:250,time:"~40 min"},{id:"b2-w5",type:"message",prompt:"Short formal message (~80 words): inform your team that you will be on study leave for two weeks; explain coverage arrangements.",target:80,time:"~15 min"}]},iz=[{id:"task",label:"Task completed: all required points are addressed"},{id:"grammar",label:"Grammar: forms (cases, tenses, agreement) are mostly correct"},{id:"vocab",label:"Vocabulary: appropriate range and accuracy"},{id:"structure",label:"Structure: clear flow, appropriate connectors"},{id:"length",label:"Length: within target range"}],Tg={B1:[{id:"task",label:"Task fulfilment",desc:"Reader understands message; main points present",max:5},{id:"coh",label:"Cohesion",desc:"Sentences linked with basic connectors (mutta, koska, siksi, kun)",max:5},{id:"range",label:"Range",desc:"Workplace/service vocabulary used; some variety",max:5},{id:"accuracy",label:"Accuracy",desc:"Cases (partitive, genitive, inessive), past tense generally correct",max:5},{id:"register",label:"Register",desc:"Tone fits situation (informal vs semi-formal)",max:5}],B2:[{id:"task",label:"Task fulfilment",desc:"Clear position, addresses all parts, counter-argument handled",max:5},{id:"coh",label:"Cohesion & organisation",desc:"Logical structure; advanced connectors (kuitenkin, toisaalta, n\xE4in ollen)",max:5},{id:"range",label:"Range",desc:"Abstract vocabulary, banking/news register, idiomatic expressions",max:5},{id:"accuracy",label:"Accuracy",desc:"Object cases, conditional, passive, participle structures mostly correct",max:5},{id:"register",label:"Register",desc:"Formal register sustained; appropriate to YKI 4 task type",max:5}]},oz={"a1-w1":"Hei! Minun nimeni on Ishtiak. Min\xE4 asun Espoossa. Olen Bangladeshista. Min\xE4 puhun bengalia, englantia ja v\xE4h\xE4n suomea. Tykk\xE4\xE4n matkustamisesta ja kirjoittamisesta.","a1-w2":"Hei Anna! Menn\xE4\xE4nk\xF6 lauantaina kahville? Voitaisiin tavata kello 14 Espoon keskuksen kahvilassa. Sopiiko?","a2-w1":"Hei Marja, valitettavasti min\xE4 en p\xE4\xE4se huomiseen kokoukseen. Minulla on l\xE4\xE4k\xE4riaika kello kymmenen. Sopisiko sinulle, ett\xE4 siirr\xE4mme kokouksen perjantaihin kello 13? Pahoittelut tilanteesta. Yst\xE4v\xE4llisin terveisin, Ishtiak.","b1-w1":"Hyv\xE4 asiakaspalvelu, huomasin eilen, ett\xE4 tilill\xE4ni on 12.5.2026 maksu summaltaan 245,00 euroa, jota en tunnista. Pyyd\xE4n, ett\xE4 selvit\xE4tte tapahtuman ja palautatte mahdollisesti virheellisen veloituksen. Toivon kirjallista vastausta seitsem\xE4n vuorokauden kuluessa. Lis\xE4tiedot annan mielell\xE4ni puhelimitse. Yst\xE4v\xE4llisin terveisin, Ishtiak Ahmed.","b1-w2":"Mielest\xE4ni suomen kielen taito on t\xE4rke\xE4 monessa ty\xF6ss\xE4, mutta sit\xE4 ei pit\xE4isi vaatia kaikkiin teht\xE4viin. Esimerkiksi kansainv\xE4lisiss\xE4 yrityksiss\xE4 ty\xF6kielen\xE4 on usein englanti, ja kielitaitovaatimus rajoittaa turhaan osaajien rekrytointia. Toisaalta asiakaspalveluteht\xE4viss\xE4, kuten pankkien konttoreissa, suomen kieli on v\xE4ltt\xE4m\xE4t\xF6n, koska iso osa asiakkaista k\xE4ytt\xE4\xE4 palveluita suomeksi. Mielest\xE4ni ty\xF6nantajien kannattaisi mietti\xE4, mihin teht\xE4v\xE4\xE4n suomi todella tarvitaan, ja tarjota muille rooleille tukea kielen oppimiseen.","b2-w1":"Suomen osaajapulan ratkaisemiseksi tulisi mielest\xE4ni helpottaa muiden kuin suomenkielisten asiantuntijoiden pysyv\xE4n oleskeluluvan saamista. Ensinn\xE4kin korkeasti koulutetut maahanmuuttajat tuovat verotuloja ja kasvattavat yhteiskunnan osaamisp\xE4\xE4omaa, eik\xE4 heid\xE4n kotoutumistaan saa hidastaa byrokraattisilla esteill\xE4. Toiseksi monet kansainv\xE4liset yritykset toimivat englanniksi, ja heid\xE4n asiantuntijoidensa ty\xF6panos hy\xF6dytt\xE4\xE4 Suomea siit\xE4 riippumatta, kuinka sujuvasti he puhuvat suomea kahden vuoden kuluttua maahantulosta. On totta, ett\xE4 kielitaito edist\xE4\xE4 syvemp\xE4\xE4 kotoutumista, ja siksi pysyv\xE4n luvan ehtona voi olla esimerkiksi todennettu B1-taso, joka on saavutettavissa ty\xF6n ohessa. Kokonaisuudessaan rohkeampi linja palvelisi sek\xE4 ty\xF6markkinoita ett\xE4 maahanmuuttajien hyvinvointia."},E$={B1:{skillPacks:{textComp:{ref:"b1-r1",note:"Read the Selkouutiset-style article and answer the comprehension Qs in Reading."},listening:{url:"https://areena.yle.fi/podcastit/1-50321565",note:"Yle Selkouutiset podcast \u2014 listen to one episode, write 5 facts you understood, then check by reading the transcript."},writing:["b1-w1","b1-w3"],speaking:["Esittele itsesi 1 minuutissa. Sano nimesi, mist\xE4 olet, miss\xE4 asut, ty\xF6si/opintosi, ja kerro yksi asia, josta pid\xE4t Suomessa.","Kerro, miksi haluat ty\xF6skennell\xE4 Suomen pankkialalla. K\xE4yt\xE4 1\u20132 minuuttia.","Kuvaile viimeisin pankkiasiointikokemuksesi: miss\xE4, miksi, miten meni."]},fullMock:{reading:"b1-r3",writing:"b1-w2",listening:"https://yle.fi/uutiset/osasto/selkouutiset",speakingPrompt:"Mielipide (2 min): Pit\xE4isik\xF6 julkisten palveluiden olla saatavilla useammilla kielill\xE4? Perustele."}},B2:{skillPacks:{textComp:{ref:"b2-r1",note:"Read the banking-sector article and answer comprehension Qs in Reading."},listening:{url:"https://areena.yle.fi/audio/1-3242040",note:"Yle Ykk\xF6saamu \u2014 pick one segment. Take notes in Finnish, summarise in 5 sentences."},writing:["b2-w1","b2-w2","b2-w3"],speaking:['Pid\xE4 2 minuutin mielipidepuheenvuoro: "Onko suomen kielen taito v\xE4ltt\xE4m\xE4t\xF6n asiantuntijaty\xF6ss\xE4?"',"Selit\xE4 ammattilaiselle, mik\xE4 on rahanpesun esto ja miksi se on t\xE4rke\xE4\xE4 pankissa. 2\u20133 min.","Roolipeli (1 min): Olet pankissa, ja asiakkaalla on ep\xE4ilytt\xE4v\xE4 tilitapahtuma. Kysy lis\xE4tietoja kohteliaasti."]},fullMock:{reading:"b2-r2",writing:"b2-w4",listening:"https://areena.yle.fi/audio/1-3242040",speakingPrompt:'Mielipide (2 min): "Digitalisaatio uhkaa ik\x
